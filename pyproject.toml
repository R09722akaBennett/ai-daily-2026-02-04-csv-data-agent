[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdoc-idp"
version = "0.1.0"
description = "Self-hosted IDP service powered by Docling — turn messy enterprise documents into LLM-ready Markdown, JSON, and tables."
readme = "README.md"
requires-python = ">=3.11"
# Core service deps stay light so CI / tests / cold demos start in seconds.
# Real document extraction needs the [extract] extra (pulls in Docling + torch).
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.26",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "rich>=13.7",
  "streamlit>=1.31",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
extract = [
  # Heavy: pulls torch + transformers + IBM layout/table models on first run.
  # Pin a recent floor; let the user upgrade.
  "docling>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.3",
  "mypy>=1.8",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
